[package]
name = "reserves-attestor-plugin"
version = "0.1.0"
edition = "2024"
description = "CLN plugin that produces a signed on-chain + Lightning balance statement for a single node"

[[bin]]
name = "reserves-attestor-plugin"
path = "src/main.rs"

[dependencies]
cln-plugin  = { version = "0.7" }
cln-rpc     = { version = "0.6" }
tokio       = { version = "1", features = ["full"] }
chrono      = { version = "0.4" }
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1" }
anyhow      = { version = "1" }
tracing     = { version = "0.1" }